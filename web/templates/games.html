{{define "content"}}
<h1>{{t "common.supported_games"}}</h1>
{{range .Games}}
<section class="panel">
  <h2><a href="{{.URL}}">{{.Name}}</a></h2>
  <p class="line"><span class="chip">{{.Lang}}</span>{{range .Tags}}<span class="chip">{{t (print "tag." .)}}</span>{{end}}</p>
</section>
{{end}}
<section class="panel">
  <p>{{t "games.missing"}} <a href="https://github.com/wo0lien/compete/issues/new?template=request-game.md">{{t "games.ask"}}</a> {{t "games.ask_after"}}</p>
</section>
{{end}}
