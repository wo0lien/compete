{{define "base"}}<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>compete</title>
<link rel="stylesheet" href="{{asset "app.css"}}">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="{{asset "icon.svg"}}" type="image/svg+xml">
<meta name="theme-color" content="#62C6F2">
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');</script>
<script src="{{asset "htmx.min.js"}}" defer></script>
</head>
<body hx-boost:inherited="true">
<header class="top">
  <a href="/" class="logo">compete</a>
  <div class="nav">
    {{/* full reload, not hx-boost: the swap would keep the old <html lang> */}}
    <form method="post" action="/lang" hx-boost="false"><input type="hidden" name="back" value="{{here}}"><button class="lang" name="lang" value="{{t "nav.switch_to"}}" lang="{{t "nav.switch_to"}}">{{t "nav.switch_label"}}</button></form>
    {{with .User}}<a href="/account" class="me">{{template "pawn" .Pawn}}{{.Username}}</a>{{end}}
  </div>
</header>
<main>
{{template "content" .}}
</main>
</body>
</html>{{end}}
