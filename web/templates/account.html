{{define "content"}}
<h1>{{.User.Username}}</h1>
{{with .Error}}<p class="error">{{.}}</p>{{end}}
<section class="panel">
  <h2>{{t "account.pawn"}}</h2>
  <form method="post" action="/account/pawn" class="inline-form">
    {{template "pawn" .User.Pawn}}
    <label for="pawn" class="visually-hidden">{{t "account.pawn_color"}}</label>
    <input id="pawn" type="color" name="pawn" value="{{.User.Pawn}}">
    <button class="btn">{{t "common.save"}}</button>
  </form>
</section>
<section class="panel">
  <form method="post" action="/logout"><button class="btn">{{t "account.logout"}}</button></form>
</section>
<section class="panel">
  <h2>{{t "account.delete_title"}}</h2>
  <p>{{t "account.delete_text"}}</p>
  <form method="post" action="/account/delete" class="stack">
    <label for="password">{{t "common.password"}}</label>
    <input id="password" type="password" name="password" required autocomplete="current-password">
    <button class="btn danger">{{t "account.delete_button"}}</button>
  </form>
</section>
{{end}}
