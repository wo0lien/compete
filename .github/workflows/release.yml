name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./... && go test ./...
      - name: build
        run: |
          mkdir dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=$GITHUB_REF_NAME" -o compete .
            tar -czf "dist/compete_linux_$arch.tar.gz" compete
          done
          (cd dist && sha256sum *.tar.gz > checksums.txt)
      - name: check -version
        run: |
          tar -xzf dist/compete_linux_amd64.tar.gz -C "$RUNNER_TEMP"
          cd "$(mktemp -d)"
          test "$("$RUNNER_TEMP/compete" -version)" = "$GITHUB_REF_NAME"
          test ! -e compete.db
      - run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
