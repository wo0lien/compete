name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: changelog has this release
        run: |
          # A vX.Y.Z release must say what changed for members (web/changelog.toml).
          if echo "$GITHUB_REF_NAME" | grep -Eqx 'v[0-9]+\.[0-9]+\.[0-9]+'; then
            grep -qx "version = \"$GITHUB_REF_NAME\"" web/changelog.toml ||
              { echo "::error::no web/changelog.toml entry for $GITHUB_REF_NAME"; exit 1; }
          fi
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./... && go test ./...
      - name: build
        run: |
          mkdir dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=$GITHUB_REF_NAME" -o compete .
            tar -czf "dist/compete_linux_$arch.tar.gz" compete
          done
          (cd dist && sha256sum *.tar.gz > checksums.txt)
      - name: check -version
        run: |
          tar -xzf dist/compete_linux_amd64.tar.gz -C "$RUNNER_TEMP"
          cd "$(mktemp -d)"
          test "$("$RUNNER_TEMP/compete" -version)" = "$GITHUB_REF_NAME"
          test ! -e compete.db
      - name: plain release or pre-release
        id: kind
        run: |
          # Only vX.Y.Z is a release: it moves "latest" (image and GitHub). Anything else is a pre-release.
          if echo "$GITHUB_REF_NAME" | grep -Eqx 'v[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "tags=ghcr.io/wo0lien/compete:$GITHUB_REF_NAME,ghcr.io/wo0lien/compete:latest" >>"$GITHUB_OUTPUT"
            echo "flag=" >>"$GITHUB_OUTPUT"
          else
            echo "tags=ghcr.io/wo0lien/compete:$GITHUB_REF_NAME" >>"$GITHUB_OUTPUT"
            echo "flag=--prerelease" >>"$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.kind.outputs.tags }}
      - name: check the pushed image
        run: test "$(docker run --rm "ghcr.io/wo0lien/compete:$GITHUB_REF_NAME" -version)" = "$GITHUB_REF_NAME"
      - run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes ${{ steps.kind.outputs.flag }}
        env:
          GH_TOKEN: ${{ github.token }}
